<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>لعبة سيارات الهواتف الفائقة</title>
    <style>
        * {
            user-select: none;
            -webkit-user-select: none;
            touch-action: manipulation;
        }
        body {
            margin: 0;
            overflow: hidden;
            background-color: #0b0e14;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }
        #ui {
            position: absolute;
            top: 15px;
            right: 15px;
            color: #fff;
            background: rgba(0, 0, 0, 0.6);
            padding: 10px 18px;
            border-radius: 20px;
            border: 1px solid rgba(0, 255, 255, 0.3);
            pointer-events: none;
            z-index: 10;
        }
        h1 { margin: 0; font-size: 16px; color: #00ffff; }
        
        /* عناصر التحكم باللمس للهاتف */
        .touch-controls {
            position: absolute;
            bottom: 25px;
            width: 100%;
            height: 100px;
            display: flex;
            justify-content: space-between;
            padding: 0 25px;
            box-sizing: border-box;
            z-index: 20;
        }
        .btn-group {
            display: flex;
            gap: 15px;
        }
        .btn {
            width: 75px;
            height: 75px;
            background: rgba(255, 255, 255, 0.2);
            border: 2px solid rgba(255, 255, 255, 0.5);
            border-radius: 50%;
            color: white;
            font-size: 26px;
            font-weight: bold;
            display: flex;
            justify-content: center;
            align-items: center;
            backdrop-filter: blur(5px);
            touch-action: none;
        }
        .btn:active {
            background: rgba(0, 255, 255, 0.6);
            transform: scale(0.92);
        }
    </style>
</head>
<body>

    <div id="ui">
        <h1>محاكي المدينة الملونة 3D</h1>
    </div>

    <!-- أزرار شاشة اللمس للهواتف -->
    <div class="touch-controls">
        <div class="btn-group">
            <div class="btn" id="btnLeft">◀</div>
            <div class="btn" id="btnRight">▶</div>
        </div>
        <div class="btn-group">
            <div class="btn" id="btnBrake">🛑</div>
            <div class="btn" id="btnGas">▲</div>
        </div>
    </div>

    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>

    <script>
        const scene = new THREE.Scene();
        scene.background = new THREE.Color(0x0b0e14);
        scene.fog = new THREE.FogExp2(0x0b0e14, 0.012);

        const camera = new THREE.PerspectiveCamera(60, window.innerWidth / window.innerHeight, 0.1, 1000);
        const renderer = new THREE.WebGLRenderer({ antialias: true });
        renderer.setSize(window.innerWidth, window.innerHeight);
        renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
        renderer.shadowMap.enabled = true;
        document.body.appendChild(renderer.domElement);

        const ambientLight = new THREE.AmbientLight(0xffffff, 0.6);
        scene.add(ambientLight);

        const sunLight = new THREE.DirectionalLight(0xffd700, 1.2);
        sunLight.position.set(30, 60, 20);
        scene.add(sunLight);

        // الأرضية والشارع
        const grassGeo = new THREE.PlaneGeometry(200, 1000);
        const grassMat = new THREE.MeshStandardMaterial({ color: 0x112211, roughness: 0.9 });
        const grass = new THREE.Mesh(grassGeo, grassMat);
        grass.rotation.x = -Math.PI / 2;
        scene.add(grass);

        const roadGeo = new THREE.PlaneGeometry(20, 1000);
        const roadMat = new THREE.MeshStandardMaterial({ color: 0x1a1a1a, roughness: 0.6 });
        const road = new THREE.Mesh(roadGeo, roadMat);
        road.rotation.x = -Math.PI / 2;
        road.position.y = 0.01;
        scene.add(road);

        const lineGeo = new THREE.PlaneGeometry(0.5, 4);
        const lineMat = new THREE.MeshBasicMaterial({ color: 0xffffff });
        for (let z = -500; z < 500; z += 10) {
            const line = new THREE.Mesh(lineGeo, lineMat);
            line.rotation.x = -Math.PI / 2;
            line.position.set(0, 0.02, z);
            scene.add(line);
        }

        // المباني الملونة
        const colors = [0xff0055, 0x00ccff, 0xffcc00, 0x9900ff, 0x00ff66, 0xff6600];
        for (let z = -450; z <= 450; z += 25) {
            [-22, 22].forEach(x => {
                const height = Math.random() * 25 + 15;
                const buildingGeo = new THREE.BoxGeometry(12, height, 12);
                const randomColor = colors[Math.floor(Math.random() * colors.length)];
                const buildingMat = new THREE.MeshStandardMaterial({ color: randomColor, roughness: 0.3 });
                const b = new THREE.Mesh(buildingGeo, buildingMat);
                b.position.set(x, height / 2, z);
                scene.add(b);
            });
        }

        // دالة السيارات
        function createCar(color, isPlayer = false) {
            const group = new THREE.Group();
            const bodyGeo = new THREE.BoxGeometry(1.8, 0.7, 3.8);
            const bodyMat = new THREE.MeshStandardMaterial({ color: color, metalness: 0.8, roughness: 0.2 });
            const body = new THREE.Mesh(bodyGeo, bodyMat);
            body.position.y = 0.5;
            group.add(body);

            const cabinGeo = new THREE.BoxGeometry(1.4, 0.5, 1.8);
            const cabinMat = new THREE.MeshStandardMaterial({ color: 0x111111, roughness: 0.1 });
            const cabin = new THREE.Mesh(cabinGeo, cabinMat);
            cabin.position.set(0, 1.0, -0.2);
            group.add(cabin);
            return group;
        }

        const playerCar = createCar(0x00ffff, true);
        playerCar.position.set(0, 0, 0);
        scene.add(playerCar);

        const npcCars = [];
        const npcColors = [0xff2222, 0x22ff22, 0xffff22, 0xff22ff];
        for (let i = 0; i < 6; i++) {
            const npc = createCar(npcColors[i % npcColors.length]);
            const lane = (i % 2 === 0) ? -4 : 4;
            npc.position.set(lane, 0, (i * 40) - 100);
            npc.speed = 0.1 + Math.random() * 0.1;
            scene.add(npc);
            npcCars.push(npc);
        }

        const keys = { w: false, s: false, a: false, d: false };

        const bindTouch = (id, key) => {
            const el = document.getElementById(id);
            if(!el) return;
            el.addEventListener('touchstart', (e) => { e.preventDefault(); keys[key] = true; }, {passive: false});
            el.addEventListener('touchend', (e) => { e.preventDefault(); keys[key] = false; }, {passive: false});
        };
        bindTouch('btnGas', 'w');
        bindTouch('btnBrake', 's');
        bindTouch('btnLeft', 'a');
        bindTouch('btnRight', 'd');

        let carSpeed = 0;
        const maxSpeed = 0.5;
        const accel = 0.01;
        const friction = 0.005;

        function checkCollision(newX, newZ) {
            if (Math.abs(newX) > 9) return true;
            for (let npc of npcCars) {
                const dx = Math.abs(newX - npc.position.x);
                const dz = Math.abs(newZ - npc.position.z);
                if (dx < 1.8 && dz < 3.6) return true;
            }
            return false;
        }

        function animate() {
            requestAnimationFrame(animate);

            if (keys.w) carSpeed = Math.min(carSpeed + accel, maxSpeed);
            else if (keys.s) carSpeed = Math.max(carSpeed - accel, -maxSpeed / 2);
            else {
                if (carSpeed > 0) carSpeed = Math.max(0, carSpeed - friction);
                if (carSpeed < 0) carSpeed = Math.min(0, carSpeed + friction);
            }

            let turnAngle = 0;
            if (keys.a) turnAngle += 0.03;
            if (keys.d) turnAngle -= 0.03;

            const nextRotation = playerCar.rotation.y + turnAngle * (carSpeed / maxSpeed);
            const nextX = playerCar.position.x + Math.sin(nextRotation) * carSpeed;
            const nextZ = playerCar.position.z + Math.cos(nextRotation) * carSpeed;

            if (!checkCollision(nextX, nextZ)) {
                playerCar.rotation.y = nextRotation;
                playerCar.position.x = nextX;
                playerCar.position.z = nextZ;
            } else {
                carSpeed = -carSpeed * 0.3;
            }

            npcCars.forEach(npc => {
                npc.position.z += npc.speed;
                if (npc.position.z > playerCar.position.z + 100) {
                    npc.position.z = playerCar.position.z - 150;
                }
            });

            const camOffset = new THREE.Vector3(0, 5, -10);
            camOffset.applyAxisAngle(new THREE.Vector3(0, 1, 0), playerCar.rotation.y);
            camera.position.copy(playerCar.position).add(camOffset);
            camera.lookAt(playerCar.position.x, playerCodeOpt = playerCar.position.y + 1, playerCar.position.z);

            renderer.render(scene, camera);
        }

        animate();

        window.addEventListener('resize', () => {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
        });
    </script>
</body>
</html>
