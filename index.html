<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>لعبة قتال الأسلحة على الحلبة المتمايلة - 3D</title>
    <style>
        * {
            user-select: none;
            -webkit-user-select: none;
            touch-action: manipulation;
            box-sizing: border-box;
            -webkit-touch-callout: none;
        }
        body {
            margin: 0;
            overflow: hidden;
            background-color: #020205;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }
        #hud {
            position: absolute;
            top: 20px;
            right: 20px;
            color: #fff;
            background: rgba(10, 12, 20, 0.85);
            padding: 12px 20px;
            border-radius: 14px;
            border: 1px solid rgba(255, 0, 85, 0.5);
            box-shadow: 0 0 20px rgba(255, 0, 85, 0.3);
            backdrop-filter: blur(10px);
            z-index: 10;
        }
        h2 { margin: 0 0 3px 0; font-size: 13px; color: #ff0055; letter-spacing: 2px; text-transform: uppercase; }
        .score-val { font-size: 24px; font-weight: 900; color: #ffffff; text-shadow: 0 0 10px #ff0055; }

        /* أزرار التحكم باللمس للهواتف */
        .controls-layer {
            position: absolute;
            bottom: 25px;
            width: 100%;
            display: flex;
            justify-content: space-between;
            padding: 0 25px;
            z-index: 20;
            pointer-events: none;
        }
        .action-group {
            display: flex;
            gap: 15px;
            pointer-events: auto;
        }
        .control-btn {
            width: 75px;
            height: 75px;
            background: rgba(255, 255, 255, 0.08);
            border: 2px solid rgba(255, 0, 85, 0.6);
            border-radius: 50%;
            color: #ff0055;
            font-size: 26px;
            font-weight: bold;
            display: flex;
            justify-content: center;
            align-items: center;
            backdrop-filter: blur(8px);
            box-shadow: 0 5px 15px rgba(0, 0, 0, 0.6);
        }
        .control-btn:active, .control-btn.active {
            background: rgba(255, 0, 85, 0.5);
            color: #ffffff;
            transform: scale(0.92);
            box-shadow: 0 0 20px #ff0055;
        }
        .fire-btn {
            border-color: #00f3ff;
            color: #00f3ff;
            background: rgba(0, 243, 255, 0.15);
            width: 85px;
            height: 85px;
        }
        .fire-btn:active {
            background: rgba(0, 243, 255, 0.6);
            color: #fff;
            box-shadow: 0 0 25px #00f3ff;
        }
    </style>
</head>
<body>

    <div id="hud">
        <h2>النقاط المحرزة</h2>
        <div class="score-val"><span id="scoreDisplay">0</span> نقطة</div>
    </div>

    <!-- أزرار اللمس للتحركة وإطلاق النار -->
    <div class="controls-layer">
        <div class="action-group">
            <div class="control-btn" id="leftBtn">◀</div>
            <div class="control-btn" id="rightBtn">▶</div>
        </div>
        <div class="action-group">
            <div class="control-btn" id="upBtn">▲</div>
            <div class="control-btn fire-btn" id="fireBtn">💥</div>
        </div>
    </div>

    <!-- استدعاء مكتبة الجرافيك العالمية Three.js -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>

    <script>
        // --- إعداد بيئة العرض والمشهد ---
        const scene = new THREE.Scene();
        scene.background = new THREE.Color(0x030308);
        scene.fog = new THREE.FogExp2(0x030308, 0.012);

        const camera = new THREE.PerspectiveCamera(65, window.innerWidth / window.innerHeight, 0.1, 1500);
        const renderer = new THREE.WebGLRenderer({ antialias: true, powerPreference: "high-performance" });
        renderer.setSize(window.innerWidth, window.innerHeight);
        renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
        renderer.shadowMap.enabled = true;
        renderer.shadowMap.type = THREE.PCFSoftShadowMap;
        renderer.toneMapping = THREE.ACESFilmicToneMapping;
        renderer.toneMappingExposure = 1.3;
        document.body.appendChild(renderer.domElement);

        // --- الإضاءة السينمائية ---
        const ambientLight = new THREE.AmbientLight(0x223344, 0.8);
        scene.add(ambientLight);

        const dirLight = new THREE.DirectionalLight(0xff0055, 1.5);
        dirLight.position.set(30, 80, 30);
        dirLight.castShadow = true;
        scene.add(dirLight);

        const blueNeonLight = new THREE.PointLight(0x00f3ff, 3, 80);
        blueNeonLight.position.set(0, 10, 0);
        scene.add(blueNeonLight);

        // --- بناء الحلبة الدائرية المتمايلة ---
        const arenaGroup = new THREE.Group();
        
        const floorGeo = new THREE.CylinderGeometry(45, 45, 3, 64);
        const floorMat = new THREE.MeshStandardMaterial({ color: 0x11131a, roughness: 0.4, metalness: 0.6 });
        const arenaFloor = new THREE.Mesh(floorGeo, floorMat);
        arenaFloor.position.y = -1.5;
        arenaFloor.receiveShadow = true;
        arenaGroup.add(arenaFloor);

        // حافة الحلبة المضيئة (Neon Border)
        const ringGeo = new THREE.TorusGeometry(45, 0.8, 16, 100);
        const ringMat = new THREE.MeshBasicMaterial({ color: 0xff0055 });
        const arenaRing = new THREE.Mesh(ringGeo, ringMat);
        arenaRing.rotation.x = Math.PI / 2;
        arenaRing.position.y = 0;
        arenaGroup.add(arenaRing);

        scene.add(arenaGroup);

        // --- تصميم شخصية البطل (اللاعب) ---
        function createPlayer() {
            const player = new THREE.Group();
            
            // الجسم
            const bodyGeo = new THREE.BoxGeometry(1.2, 1.8, 0.8);
            const bodyMat = new THREE.MeshStandardMaterial({ color: 0x00f3ff, roughness: 0.2, metalness: 0.8 });
            const body = new THREE.Mesh(bodyGeo, bodyMat);
            body.position.y = 0.9;
            body.castShadow = true;
            player.add(body);

            // السلاح
            const gunGeo = new THREE.BoxGeometry(0.3, 0.3, 1.2);
            const gunMat = new THREE.MeshStandardMaterial({ color: 0xffffff, metalness: 0.9 });
            const gun = new THREE.Mesh(gunGeo, gunMat);
            gun.position.set(0.7, 1.0, 0.6);
            player.add(gun);

            return player;
        }

        const player = createPlayer();
        player.position.set(0, 0, 15);
        scene.add(player);

        // --- تصميم الأعداء (NPCs) ---
        const enemies = [];
        function spawnEnemy() {
            const enemy = new THREE.Group();
            const eBodyGeo = new THREE.BoxGeometry(1.2, 1.8, 0.8);
            const eBodyMat = new THREE.MeshStandardMaterial({ color: 0xff0033, roughness: 0.3, metalness: 0.5 });
            const eBody = new THREE.Mesh(eBodyGeo, eBodyMat);
            eBody.position.y = 0.9;
            eBody.castShadow = true;
            enemy.add(eBody);

            // توزيع عشوائي على محيط الدائرة
            const angle = Math.random() * Math.PI * 2;
            const radius = 30 + Math.random() * 10;
            enemy.position.set(Math.cos(angle) * radius, 0, Math.sin(angle) * radius);
            enemy.angle = angle;
            enemy.radius = radius;
            
            scene.add(enemy);
            enemies.push(enemy);
        }

        // إنشاء 5 أعداء في البداية
        for(let i=0; i<5; i++) spawnEnemy();

        // --- نظام الرصاصات (Bullets) ---
        const bullets = [];
        function fireBullet() {
            const bulletGeo = new THREE.SphereGeometry(0.25, 16, 16);
            const bulletMat = new THREE.MeshBasicMaterial({ color: 0x00ffff });
            const bullet = new THREE.Mesh(bulletGeo, bulletMat);
            
            bullet.position.copy(player.position);
            bullet.position.y += 1.0;
            
            // اتجاه إطلاق الرصاصة بناءً على دوران اللاعب
            const dir = new THREE.Vector3(0, 0, -1).applyAxisAngle(new THREE.Vector3(0, 1, 0), player.rotation.y);
            bullet.velocity = dir.multiplyScalar(1.2);
            
            scene.add(bullet);
            bullets.push(bullet);
        }

        // --- نظام التحكم التفاعلي ---
        const controls = { left: false, right: false, forward: false, fire: false };

        const bindTouch = (id, key) => {
            const el = document.getElementById(id);
            if (!el) return;
            el.addEventListener('touchstart', (e) => { e.preventDefault(); controls[key] = true; el.classList.add('active'); }, { passive: false });
            el.addEventListener('touchend', (e) => { e.preventDefault(); controls[key] = false; el.classList.remove('active'); }, { passive: false });
        };

        bindTouch('leftBtn', 'left');
        bindTouch('rightBtn', 'right');
        bindTouch('upBtn', 'forward');
        
        // زر إطلاق النار الخاص
        const fireEl = document.getElementById('fireBtn');
        fireEl.addEventListener('touchstart', (e) => {
            e.preventDefault();
            fireBullet();
            fireEl.classList.add('active');
        }, { passive: false });
        fireEl.addEventListener('touchend', (e) => {
            e.preventDefault();
            fireEl.classList.remove('active');
        }, { passive: false });

        // لوحة المفاتيح للحاسوب أيضاً
        window.addEventListener('keydown', (e) => {
            if (e.key === 'ArrowLeft' || e.key.toLowerCase() === 'a') controls.left = true;
            if (e.key === 'ArrowRight' || e.key.toLowerCase() === 'd') controls.right = true;
            if (e.key === 'ArrowUp' || e.key.toLowerCase() === 'w') controls.forward = true;
            if (e.key === ' ') fireBullet();
        });
        window.addEventListener('keyup', (e) => {
            if (e.key === 'ArrowLeft' || e.key.toLowerCase() === 'a') controls.left = false;
            if (e.key === 'ArrowRight' || e.key.toLowerCase() === 'd') controls.right = false;
            if (e.key === 'ArrowUp' || e.key.toLowerCase() === 'w') controls.forward = false;
        });

        let score = 0;
        let arenaTime = 0;

        // --- حلقة اللعبة الأساسية (Game Loop) ---
        function gameLoop() {
            requestAnimationFrame(gameLoop);

            arenaTime += 0.02;
            // تمايل الحلبة الدائرية بسلاسة
            arenaGroup.rotation.z = Math.sin(arenaTime * 0.8) * 0.06;
            arenaGroup.rotation.x = Math.cos(arenaTime * 0.6) * 0.06;

            // حركة اللاعب والانعطاف
            if (controls.left) player.rotation.y += 0.04;
            if (controls.right) player.rotation.y -= 0.04;

            if (controls.forward) {
                const moveDir = new THREE.Vector3(0, 0, -0.35).applyAxisAngle(new THREE.Vector3(0, 1, 0), player.rotation.y);
                player.position.add(moveDir);
            }

            // منع اللاعب من الخروج عن حدود الحلبة الدائرية
            const distFromCenter = Math.sqrt(player.position.x ** 2 + player.position.z ** 2);
            if (distFromCenter > 42) {
                player.position.normalize().multiplyScalar(42);
            }

            // تحديث الرصاصات واكتشاف الاصطدام بالأعداء
            for (let i = bullets.length - 1; i >= 0; i--) {
                let b = bullets[i];
                b.position.add(b.velocity);

                // اختبار الاصطدام مع الأعداء
                for (let j = enemies.length - 1; j >= 0; j--) {
                    let en = enemies[j];
                    if (b.position.distanceTo(en.position) < 1.5) {
                        // إصابة ناجحة! حذف العدو والرصاصة وإضافة نقاط
                        scene.remove(en);
                        enemies.splice(j, 1);
                        scene.remove(b);
                        bullets.splice(i, 1);
                        
                        score += 100;
                        document.getElementById('scoreDisplay').innerText = score;

                        // ظهور عدو جديد
                        spawnEnemy();
                        break;
                    }
                }

                // حذف الرصاصة إذا خرجت بعيداً
                if (b && b.position.length() > 60) {
                    scene.remove(b);
                    bullets.splice(i, 1);
                }
            }

            // تحركة الأعداء بشكل دائري حول الحلبة
            enemies.forEach(en => {
                en.angle += 0.01;
                en.position.x = Math.cos(en.angle) * en.radius;
                en.position.z = Math.sin(en.angle) * en.radius;
            });

            // كاميرا سينمائية خلف اللاعب مباشرة تتمايل معه
            const camOffset = new THREE.Vector3(0, 5, 11);
            camOffset.applyAxisAngle(new THREE.Vector3(0, 1, 0), player.rotation.y);
            camera.position.copy(player.position).add(camOffset);
            
            const lookTarget = player.position.clone();
            lookTarget.y += 1.0;
            camera.lookAt(lookTarget);

            renderer.render(scene, camera);
        }

        gameLoop();

        // التكيف التلقائي مع شاشات الهواتف
        window.addEventListener('resize', () => {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
        });
    </script>
</body>
</html>
