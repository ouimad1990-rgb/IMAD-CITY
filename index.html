<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>لعبة سيارات الهواتف الفائقة</title>
    <style>
        * {
            user-select: none;
            -webkit-user-select: none;
            touch-action: manipulation;
        }
        body {
            margin: 0;
            overflow: hidden;
            background-color: #050508;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }
        #ui {
            position: absolute;
            top: 15px;
            right: 15px;
            color: #fff;
            background: rgba(0, 0, 0, 0.6);
            padding: 10px 18px;
            border-radius: 20px;
            border: 1px solid rgba(0, 255, 255, 0.3);
            pointer-events: none;
            z-index: 10;
        }
        h1 { margin: 0; font-size: 16px; color: #00ffff; }
        
        /* عناصر التحكم باللمس للهاتف */
        .touch-controls {
            position: absolute;
            bottom: 20px;
            width: 100%;
            height: 120px;
            display: flex;
            justify-content: space-between;
            padding: 0 20px;
            box-sizing: border-box;
            z-index: 20;
        }
        .btn-group {
            display: flex;
            gap: 15px;
        }
        .btn {
            width: 70px;
            height: 70px;
            background: rgba(255, 255, 255, 0.15);
            border: 2px solid rgba(255, 255, 255, 0.4);
            border-radius: 50%;
            color: white;
            font-size: 24px;
            font-weight: bold;
            display: flex;
            justify-content: center;
            align-items: center;
            backdrop-filter: blur(5px);
            touch-action: none;
        }
        .btn:active {
            background: rgba(0, 255, 255, 0.5);
            transform: scale(0.95);
        }
    </style>
</head>
<body>

    <div id="ui">
        <h1>محاكي المدينة الملونة 3D</h1>
    </div>

    <!-- أزرار شاشة اللمس للهواتف -->
    <div class="touch-controls">
        <div class="btn-group">
            <div class="btn" id="btnLeft">◀</div>
            <div class="btn" id="btnRight">▶</div>
        </div>
        <div class="btn-group">
            <div class="btn" id="btnBrake">🛑</div>
            <div class="btn" id="btnGas">▲</div>
        </div>
    </div>

    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>

    <script>
        // --- 1. إعداد المشهد والضوء ---
        const scene = new THREE.Scene();
        scene.background = new THREE.Color(0x0b0e14);
        scene.fog = new THREE.FogExp2(0x0b0e14, 0.012);

        const camera = new THREE.PerspectiveCamera(60, window.innerWidth / window.innerHeight, 0.1, 1000);
        const renderer = new THREE.WebGLRenderer({ antialias: true });
        renderer.setSize(window.innerWidth, window.innerHeight);
        renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2)); // لتحسين الأداء على الهواتف
        renderer.shadowMap.enabled = true;
        renderer.shadowMap.type = THREE.PCFSoftShadowMap;
        document.body.appendChild(renderer.domElement);

        // الإضاءة العلوية والمحيطية
        const ambientLight = new THREE.AmbientLight(0xffffff, 0.6);
        scene.add(ambientLight);

        const sunLight = new THREE.DirectionalLight(0xffd700, 1.2);
        sunLight.position.set(30, 60, 20);
        sunLight.castShadow = true;
        sunLight.shadow.mapSize.width = 1024;
        sunLight.shadow.mapSize.height = 1024;
        scene.add(sunLight);

        // --- 2. رسم الأرضية والشارع المتطور ---
        const roadGroup = new THREE.Group();

        // العشب (الجوانب)
        const grassGeo = new THREE.PlaneGeometry(200, 1000);
        const grassMat = new THREE.MeshStandardMaterial({ color: 0x112211, roughness: 0.9 });
        const grass = new THREE.Mesh(grassGeo, grassMat);
        grass.rotation.x = -Math.PI / 2;
        grass.receiveShadow = true;
        roadGroup.add(grass);

        // الشارع (الأسفلت)
        const roadGeo = new THREE.PlaneGeometry(20, 1000);
        const roadMat = new THREE.MeshStandardMaterial({ color: 0x1a1a1a, roughness: 0.6 });
        const road = new THREE.Mesh(roadGeo, roadMat);
        road.rotation.x = -Math.PI / 2;
        road.position.y = 0.01;
        road.receiveShadow = true;
        roadGroup.add(road);

        // خطوط الشارع البيضاء
        const lineGeo = new THREE.PlaneGeometry(0.5, 4);
        const lineMat = new THREE.MeshBasicMaterial({ color: 0xffffff });
        for (let z = -500; z < 500; z += 10) {
            const line = new THREE.Mesh(lineGeo, lineMat);
            line.rotation.x = -Math.PI / 2;
            line.position.set(0, 0.02, z);
            roadGroup.add(line);
        }
        scene.add(roadGroup);

        // --- 3. بناء مباني ملونة جذابة ---
        const colors = [0xff0055, 0x00ccff, 0xffcc00, 0x9900ff, 0x00ff66, 0xff6600];
        const buildings = [];

        for (let z = -450; z <= 450; z += 25) {
            [-22, 22].forEach(x => {
                const height = Math.random() * 25 + 15;
                const buildingGeo = new THREE.BoxGeometry(12, height, 12);
                const randomColor = colors[Math.floor(Math.random() * colors.length)];
                const buildingMat = new THREE.MeshStandardMaterial({ 
                    color: randomColor, 
                    roughness: 0.3,
                    metalness: 0.2
                });
                const b = new THREE.Mesh(buildingGeo, buildingMat);
                b.position.set(x, height / 2, z);
                b.castShadow = true;
                b.receiveShadow = true;
                scene.add(b);
                buildings.push(b);
            });
        }

        // --- 4. دالة إنشاء السيارات ---
        function createCar(color, isPlayer = false) {
            const group = new THREE.Group();

            // جسم السيارة
            const bodyGeo = new THREE.BoxGeometry(1.8, 0.7, 3.8);
            const bodyMat = new THREE.MeshStandardMaterial({ color: color, metalness: 0.8, roughness: 0.2 });
            const body = new THREE.Mesh(bodyGeo, bodyMat);
            body.position.y = 0.5;
            body.castShadow = true;
            group.add(body);

            // الكابينة
            const cabinGeo = new THREE.BoxGeometry(1.4, 0.5, 1.8);
            const cabinMat = new THREE.MeshStandardMaterial({ color: 0x111111, roughness: 0.1 });
            const cabin = new THREE.Mesh(cabinGeo, cabinMat);
            cabin.position.set(0, 1.0, -0.2);
            group.add(cabin);

            // أضواء السيارة
            if(isPlayer) {
                const lightGeo = new THREE.BoxGeometry(0.3, 0.2, 0.1);
                const lightMat = new THREE.MeshBasicMaterial({ color: 0xffff00 });
                const hl1 = new THREE.Mesh(lightGeo, lightMat); hl1.position.set(-0.6, 0.5, 1.9);
                const hl2 = new THREE.Mesh(lightGeo, lightMat); hl2.position.set(0.6, 0.5, 1.9);
                group.add(hl1, hl2);
            }

            return group;
        }

        // سيارة اللاعب
        const playerCar = createCar(0x00ffff, true);
        playerCar.position.set(0, 0, 0);
        scene.add(playerCar);

        // --- 5. إضافة سيارات NPC غير قابلة للاختراق ---
        const npcCars = [];
        const npcColors = [0xff2222, 0x22ff22, 0xffff22, 0xff22ff];
        
        for (let i = 0; i < 6; i++) {
            const npc = createCar(npcColors[i % npcColors.length]);
            // توزيعهم في المسارات
            const lane = (i % 2 === 0) ? -4 : 4;
            npc.position.set(lane, 0, (i * 40) - 100);
            npc.speed = 0.1 + Math.random() * 0.1;
            scene.add(npc);
            npcCars.push(npc);
        }

        // --- 6. نظام مدخلات التحكم (لوحة + لمس للهاتف) ---
        const keys = { w: false, s: false, a: false, d: false };

        // أحداث اللمس
        const bindTouch = (id, key) => {
            const el = document.getElementById(id);
            el.addEventListener('touchstart', (e) => { e.preventDefault(); keys[key] = true; });
            el.addEventListener('touchend', (e) => { e.preventDefault(); keys[key] = false; });
        };
        bindTouch('btnGas', 'w');
        bindTouch('btnBrake', 's');
        bindTouch('btnLeft', 'a');
        bindTouch('btnRight', 'd');

        // أحداث اللوحة
        window.addEventListener('keydown', (e) => {
            if (e.key === 'ArrowUp' || e.key.toLowerCase() === 'w') keys.w = true;
            if (e.key === 'ArrowDown' || e.key.toLowerCase() === 's') keys.s = true;
            if (e.key === 'ArrowLeft' || e.key.toLowerCase() === 'a') keys.a = true;
            if (e.key === 'ArrowRight' || e.key.toLowerCase() === 'd') keys.d = true;
        });
        window.addEventListener('keyup', (e) => {
            if (e.key === 'ArrowUp' || e.key.toLowerCase() === 'w') keys.w = false;
            if (e.key === 'ArrowDown' || e.key.toLowerCase() === 's') keys
